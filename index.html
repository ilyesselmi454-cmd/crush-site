<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  background: radial-gradient(circle, #ffe4ec, #ffc1d6);
  color:#2b2b2b;
  overflow:hidden;
}

/* intro */
#intro{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  color:white;
}

/* compteur */
#count{
  font-size:70px;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.3);}
  100%{transform:scale(1);}
}

/* main */
#main{
  display:none;
  padding:20px;
}

h1{
  margin-top:80px;
  font-size:28px;
  line-height:1.4;
}

/* boutons */
button{
  width:80%;
  max-width:300px;
  padding:15px;
  font-size:20px;
  margin:15px auto;
  display:block;
  border:none;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
}

#yes{
  background:#86efac;
}

#yes:active{
  transform:scale(1.1);
}

#no{
  background:#fda4af;
  position:absolute;
}

/* hearts */
.heart{
  position:absolute;
  font-size:20px;
  animation:float 4s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);opacity:0;}
}

/* explosion */
.explosion{
  position:absolute;
  font-size:35px;
  animation:boom 0.8s ease forwards;
}

@keyframes boom{
  from{transform:scale(0);}
  to{transform:scale(2);opacity:0;}
}
</style>
</head>

<body>

<div id="intro">
  <div id="count">3</div>
</div>

<div id="main">
  <h1>Would you be my girl? 💖</h1>
  <button id="yes">Yes 😍</button>
  <button id="no">No 😢</button>
</div>

<!-- sons en ligne -->
<audio id="yesSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="noSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
<audio id="bgMusic" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" loop></audio>

<script>
const count = document.getElementById("count");
const intro = document.getElementById("intro");
const main = document.getElementById("main");
const bgMusic = document.getElementById("bgMusic");

let num = 3;

// compteur
let timer = setInterval(()=>{
  num--;
  count.textContent = num;

  if(num===0){
    clearInterval(timer);
    intro.style.display="none";
    main.style.display="block";
  }
},1000);

// activer son au premier touch
document.body.addEventListener("click", () => {
  bgMusic.play().catch(()=>{});
}, { once: true });

// boutons
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const yesSound = document.getElementById("yesSound");
const noSound = document.getElementById("noSound");

// fonction NO mobile
function moveNo(){
  noSound.currentTime = 0;
  noSound.play();

  const x=Math.random()*(window.innerWidth-100);
  const y=Math.random()*(window.innerHeight-100);

  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";

  const boom=document.createElement("div");
  boom.className="explosion";
  boom.innerHTML="💥";
  boom.style.left=x+"px";
  boom.style.top=y+"px";
  document.body.appendChild(boom);

  setTimeout(()=>boom.remove(),800);
}

// mobile + pc
noBtn.addEventListener("touchstart", moveNo);
noBtn.addEventListener("mouseover", moveNo);

// YES
yesBtn.onclick=()=>{
  yesSound.currentTime = 0;
  yesSound.play();

  document.body.innerHTML=`
    <h1 style="margin-top:100px;">You said YES 😍❤️</h1>
    <p>This is the beginning of something beautiful 💖</p>
  `;

  setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*25+10)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),4000);
  },150);
};
</script>

</body>
</html>
